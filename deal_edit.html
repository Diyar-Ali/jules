<main role="main" class="container-fluid mt-3">
    <!-- deal_edit.php content starts -->
    <div class="container mt-4">
        <h1>Edit Deal: Innovatech Project Alpha</h1>
        <!-- <div class="alert alert-danger">Probability must be between 0 and 1.</div> -->

        <form action="deal_edit.php?id=1" method="POST">
            <input type="hidden" name="csrf_token" value="mock_csrf_deal_edit_1">
            <input type="hidden" name="id" value="1">
            <input type="hidden" name="version" value="1">

            <div class="mb-3">
                <label for="name" class="form-label">Deal Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" value="Innovatech Project Alpha" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="organisation_id" class="form-label">Organisation <span class="text-danger">*</span></label>
                    <select class="form-select" id="organisation_id" name="organisation_id" required>
                        <option value="">-- Select Organisation --</option>
                        <option value="1" selected>Innovatech Solutions</option>
                        <option value="2">GreenLeaf Consulting</option>
                        <option value="3">Alpha Corp</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="contact_id" class="form-label">Primary Contact</label>
                    <select class="form-select" id="contact_id" name="contact_id">
                        <option value="">-- Select Contact (Optional) --</option>
                        <option value="1" selected>Alice Wonder (alice.wonder@innovatech.example.com)</option>
                        <option value="2">Bob Builder (bob.builder@greenleaf.example.com)</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="stage" class="form-label">Stage <span class="text-danger">*</span></label>
                    <select class="form-select" id="stage" name="stage" required>
                        <option value="Prospecting">Prospecting</option>
                        <option value="Qualification">Qualification</option>
                        <option value="Proposal" selected>Proposal</option>
                        <option value="Negotiation">Negotiation</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="amount" class="form-label">Amount <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="150000.00" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="close_date" class="form-label">Expected Close Date</label>
                    <input type="date" class="form-control" id="close_date" name="close_date" value="2023-11-25"> <!-- Mock: CURDATE() + 30 DAY -->
                </div>
                <div class="col-md-6 mb-3">
                    <label for="probability" class="form-label">Probability (0.00 to 1.00)</label>
                    <input type="number" step="0.01" min="0" max="1" class="form-control" id="probability" name="probability" value="0.75" placeholder="e.g., 0.75 for 75%">
                </div>
            </div>
            <div class="mb-3">
                <label for="assigned_user_id" class="form-label">Assigned To User</label>
                <select class="form-select" id="assigned_user_id" name="assigned_user_id">
                    <option value="">-- Unassigned --</option>
                    <option value="1">admin_user (Admin User)</option>
                    <option value="2" selected>standard_user (Standard User)</option>
                    <option value="3">sales_user (Sales Person)</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">Proposal for phase 1 of Project Alpha.</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Update Deal</button>
            <a href="deals.html" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
