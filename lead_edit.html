    <div class="container mt-4">
        <h1>Edit Lead: New Inquiry - Innovatech Website</h1>
        <!-- <div class="alert alert-danger">Error message here.</div> -->

        <form action="lead_edit.php?id=1" method="POST">
            <input type="hidden" name="csrf_token" value="mock_csrf_lead_edit_1">
            <input type="hidden" name="id" value="1">
            <input type="hidden" name="version" value="1">
            <!-- If lead were converted:
            <fieldset disabled>
            <div class="alert alert-warning">This lead has been converted to Deal ID X and cannot be edited.</div>
            -->

            <fieldset> <!-- Fieldset would be disabled if lead was converted -->
                <div class="mb-3">
                    <label for="name" class="form-label">Lead Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" value="New Inquiry - Innovatech Website" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="New">New</option>
                            <option value="Contacted" selected>Contacted</option>
                            <option value="Qualified">Qualified</option>
                            <option value="Unqualified">Unqualified</option>
                            <option value="Converted">Converted</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="temperature" class="form-label">Temperature</label>
                        <select class="form-select" id="temperature" name="temperature">
                            <option value="Cold">Cold</option>
                            <option value="Warm">Warm</option>
                            <option value="Hot" selected>Hot</option>
                        </select>
                    </div>
                </div>
                 <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="value" class="form-label">Value (Est.)</label>
                        <input type="number" step="0.01" class="form-control" id="value" name="value" value="25000.00">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="expected_close_date" class="form-label">Expected Close Date</label>
                        <input type="date" class="form-control" id="expected_close_date" name="expected_close_date" value="2023-11-09"> <!-- Mock: CURDATE() + 14 DAY -->
                    </div>
                </div>
                <div class="mb-3">
                    <label for="source" class="form-label">Source</label>
                    <input type="text" class="form-control" id="source" name="source" value="Website Form">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3">Inquiry about cloud services from website.</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="contact_id" class="form-label">Related Contact</label>
                        <select class="form-select" id="contact_id" name="contact_id">
                            <option value="">-- Select Contact (Optional) --</option>
                            <option value="1">Alice Wonder (alice.wonder@innovatech.example.com)</option>
                            <option value="2">Bob Builder (bob.builder@greenleaf.example.com)</option>
                            <!-- ... more contacts ... -->
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="organisation_id" class="form-label">Related Organisation</label>

                            <option value="">-- Select Organisation (Optional) --</option>
                            <option value="1" selected>Innovatech Solutions</option>
                            <option value="2">GreenLeaf Consulting</option>
                            <!-- ... more orgs ... -->
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="assigned_user_id" class="form-label">Assigned To User <span class="text-danger">*</span></label>
                    <select class="form-select" id="assigned_user_id" name="assigned_user_id" required>
                        <option value="">-- Select User --</option>
                        <option value="1">admin_user (Admin User)</option>
                        <option value="2" selected>standard_user (Standard User)</option>
                        <option value="3">sales_user (Sales Person)</option>
                    </select>
                </div>
            </fieldset> <!-- Fieldset would be disabled if lead was converted -->

            <button type="submit" class="btn btn-primary">Update Lead</button>
            <a href="leads.html" class="btn btn-secondary">Cancel</a>
